<script>/* DWELLER — simulation core. Pure logic, no DOM: runs in the browser and in Node (for the test bot).
 *
 * Resonance with The Seeker: the simulation ticks at 96 Hz, animation steps at 12 fps (8 ticks),
 * the tempo is 90 BPM (one beat = 64 ticks), tiles are 6 px and the Seeker is two tiles tall.
 * Every light that pulses does so on whole beats. Running speed is exactly 8 tiles per beat.
 */
(function (global) {
  'use strict';

  const TS = 6;                 // tile size in px
  const TICK = 96;              // simulation Hz
  const DT = 1 / TICK;
  const BEAT = 64;              // ticks per beat at 90 BPM
  const IN = { L: 1, R: 2, J: 4, D: 8 };
  const EV = { JUMP: 1, LAND: 2, ROLL: 4, WJUMP: 8, DEATH: 16, RESPAWN: 32, CHECK: 64, WIN: 128, HARDLAND: 256 };

  const C = {
    W: 5, H: 10, HR: 5,                      // hitbox: standing 5x10, rolling 5x5
    RUN: 72, CRAWL: 46,
    GACC: 1100, GFRIC: 1500, AACC: 760, AFRIC: 420,
    JUMPV: 150, GU: 540, GD: 650, CUT: 2.7, MAXFALL: 215, APEXV: 26, APEXG: 0.62,
    COYOTE: 9, BUFFER: 10,
    WSLIDE: 34, WJX: 86, WJY: 144, WLOCK: 11, WCOY: 7,
    ROLLV: 108, ROLLT: 33, ROLLCD: 20,
    BURN: 0.95, REGEN: 0.9, DEADT: 104, GRACE: 64,
    LITLO: 0.10, LITHI: 0.50,
  };

  const EPS = 1e-4;

  function smooth(e0, e1, x) {
    let t = (x - e0) / (e1 - e0);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return t * t * (3 - 2 * t);
  }

  /* ------------------------------------------------------------------ world */

  function decodeRows(level) {
    const W = level.w, H = level.h;
    const solid = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) {
      const runs = level.rows[y];
      let x = 0, v = 0;           // runs alternate: air, rock, air, rock...
      for (let i = 0; i < runs.length; i++) {
        const n = runs[i];
        if (v) solid.fill(1, y * W + x, y * W + x + n);
        x += n; v ^= 1;
      }
    }
    return solid;
  }

  function makeWorld(level) {
    const w = {
      W: level.w, H: level.h,
      solid: decodeRows(level),
      killY: level.h * TS + 40,
      lights: [], hazards: [],
      checks: level.checks.map(c => ({ x: c.x, y: c.y, i: c.i })),
      goal: level.goal, spawn: level.spawn, kills: level.kills || [],
      sections: level.sections, hints: level.hints, level,
    };
    level.lights.forEach((d, i) => {
      const l = Object.assign({ id: i, hazard: true, I: 1, k: 1 }, d);
      l.bx = l.x; l.by = l.y;            // anchor
      if (l.t === 'beam') {
        const a = l.ang === undefined ? Math.PI / 2 : l.ang;
        l.ang = a; l.dx = Math.cos(a); l.dy = Math.sin(a); l.nx = -l.dy; l.ny = l.dx;
        l.reach = l.len + l.w;
      } else if (l.t === 'watch') {
        l.reach = l.r;
      } else {
        l.reach = l.r + (l.move ? Math.max(Math.abs(l.move.rx || l.move.dx || 0), Math.abs(l.move.ry || l.move.dy || 0)) + 2 : 0);
      }
      w.lights.push(l);
      if (l.hazard) w.hazards.push(l);
    });
    updateLights(w, 0);
    return w;
  }

  function solidAt(w, tx, ty) {
    if (tx < 0 || ty < 0 || tx >= w.W) return true;
    if (ty >= w.H) return false;      // below the map is open void
    return w.solid[ty * w.W + tx] === 1;
  }

  function rectSolid(w, x, y, ww, hh) {
    const x0 = Math.floor(x / TS), x1 = Math.floor((x + ww - EPS) / TS);
    const y0 = Math.floor(y / TS), y1 = Math.floor((y + hh - EPS) / TS);
    for (let ty = y0; ty <= y1; ty++)
      for (let tx = x0; tx <= x1; tx++)
        if (solidAt(w, tx, ty)) return true;
    return false;
  }

  /* Distance along a ray to the first solid tile (Amanatides & Woo). maxD in px. */
  function castRay(w, ox, oy, dx, dy, maxD) {
    let tx = Math.floor(ox / TS), ty = Math.floor(oy / TS);
    const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const tdx = adx < 1e-9 ? 1e30 : TS / adx, tdy = ady < 1e-9 ? 1e30 : TS / ady;
    let tmx = adx < 1e-9 ? 1e30 : ((dx > 0 ? (tx + 1) * TS - ox : ox - tx * TS) / adx);
    let tmy = ady < 1e-9 ? 1e30 : ((dy > 0 ? (ty + 1) * TS - oy : oy - ty * TS) / ady);
    let t = 0;
    for (let i = 0; i < 400; i++) {
      if (tmx < tmy) { t = tmx; tmx += tdx; tx += sx; } else { t = tmy; tmy += tdy; ty += sy; }
      if (t >= maxD) return maxD;
      if (solidAt(w, tx, ty)) return t;
    }
    return maxD;
  }

  function rayClear(w, x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0;

  /* ------------------------------------------------------------------ terrain tiles

   * bit 1 y), and no alpha where no tile is drawn. */
  const TILES_PER_ROW = 17;
  let tileCv = null, tileFlip = null, cells = null, cellsW = 0, cellsH = 0;
  function buildTiles() {

      const c = document.createElement('canvas'); c.width = tileCv.width; c.height = tileCv.height;
      const x = c.getContext('2d'); x.translate(sx < 0 ? c.width : 0, sy < 0 ? c.height : 0); x.scale(sx, sy); x.drawImage(tileCv, 0, 0);
      return c;

  }

    const sx = f & 1 ? TILES_PER_ROW - 1 - col : col, sy = f & 2 ? tileCv.height / TS - 1 - row : row;

  const CH = 32;       // chunk size in tiles

  /* ------------------------------------------------------------------ level dressing */

    const S = (x, y) => D.solidAt(w, x, y);
    for (let x = 2; x < w.W - 2; x++) {

  function makeBgLayer(seed, wpx, hpx, kind) {

    const x = c.getContext('2d'); const r = rng(seed);

        const cx = (i + 0.5) * wpx / 9 + (r() - 0.5) * 30, rw = 34 + r() * 40, top = hpx * (0.15 + r() * 0.25);
        x.fillStyle = r() < 0.5 ? '#2e3849' : '#2b3545';

  /* The darkness pass: builds the light mask, dithers it to a few bands, composites a dark overlay. */

  /* ------------------------------------------------------------------ sprites in the world */
  /* Frame choice follows The Seeker's animation scripts (assets/animations/player/movement/*.anim.toml):
   * intro frames play once, then each animation loops only its loop range, 8 ticks per frame.
   * Indices here are 0-based atlas cells; the scripts count frames from 1. */
  function loopFrame(a, first, loopStart, last) {
    const f = first + Math.floor(a / 8);
    return f <= last ? f : loopStart + (f - loopStart) % (last - loopStart + 1);
  }

  function playerFrame(s) {
    const a = s.anim, landed = s.from === 'fall';
    switch (s.st) {

      case 'idle': return s.face < 0 ? ['idle', loopFrame(a, landed ? 0 : 2, 3, 11)] : ['idle', loopFrame(a, landed ? 12 : 14, 14, 23)];
      // frames 1-2 lead in (1 after a landing or a turn), then 3-10 loop
      case 'run': return ['run', loopFrame(a, landed || s.from === 'turn' ? 0 : 1, 2, 9)];
      // frame 1 once, then 2-5 loop; frames 6-12 belong to the double jump

      case 'roll': return ['roll', s.roll > 0 ? Math.min(3, Math.floor(a / 8)) : Math.floor(a / 8) % 4];
      case 'wall': return ['wall', Math.floor(a / 8) % 3];
      case 'death': return ['death', Math.min(6, Math.floor(a / 8))];
    }
    return ['idle', 14];
  }

  function drawPlayer(ctx, s, camX, camY, pass, flash) {
    const [name, idx] = playerFrame(s);
    const sh = SHEETS[pass === 'visor' ? name + 'V' : name];
    const fx = Math.round(s.x + 2.5 - camX), fy = Math.round(s.y + s.h - camY);
    const flip = s.st === 'wall' ? s.wdir < 0 : s.face < 0;

      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    }
  }

  function drawTether(ctx, c, s, camX, camY, time) {
    const sh = SHEETS.tether;
    const active = c.i <= s.cp;
    let idx;
    if (!active) idx = 0 + Math.floor(time * 3) % 2 * 0;
    else {
      const t = (Gm_timeSince(c.i) || 99);
      idx = t < 6 * 0.083 * 3 ? 2 + Math.floor(t / (0.083 * 3)) : 8 + Math.floor(time * 12) % 16;
    }
    drawFrame(ctx, sh, idx, Math.round(c.x - camX), Math.round(c.y - camY), false);
  }
  let tetherT = {};
  function Gm_timeSince(i) { return tetherT[i]; }
  function markTether(i, time) { tetherT[i] = 0; tetherT['_' + i] = time; }
  function tickTethers(dt) { for (const k in tetherT) if (k[0] !== '_') tetherT[k] += dt; }

  function drawLampCrystal(ctx, w, l, camX, camY, time, post) {

      R.drawText(ctx, touchMode ? 'TAP LOWER SCREEN  NEW DESCENT' : 'N  NEW DESCENT', LW >> 1, (LH >> 1) + 44, PAL.snow, 1, 'center');
      R.drawText(ctx, 'TIME  ' + fmtTime(runTicks / D.TICK) + '    DEATHS  ' + S_.deaths, LW >> 1, (LH >> 1) + 16, PAL.muted, 1, 'center');
      R.drawText(ctx, 'M  MUTE   F  FULLSCREEN   R  RETURN TO TETHER', LW >> 1, (LH >> 1) + 30, PAL.stone4, 1, 'center');
    }
    if (mode === 'win') {
      const a = Math.min(1, Math.max(0, (winT - 1.2) / 1.5));
      ctx.globalAlpha = a * 0.55; ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = a;
      R.drawText(ctx, 'THE CRYSTAL', LW >> 1, Math.round(LH * 0.2), PAL.snow, 2, 'center');
      R.drawText(ctx, 'LEVEL I  THE DESCENT  COMPLETE', LW >> 1, Math.round(LH * 0.2) + 22, PAL.gold, 1, 'center');
      const t = runTicks / D.TICK;
      R.drawText(ctx, 'TIME  ' + fmtTime(t) + '     LIGHT FOUND YOU  ' + S_.deaths + ' TIMES', LW >> 1, Math.round(LH * 0.2) + 38, PAL.snow, 1, 'center');
      if (bestTime) R.drawText(ctx, 'BEST  ' + fmtTime(bestTime), LW >> 1, Math.round(LH * 0.2) + 50, PAL.muted, 1, 'center');
      if (winT > 3) { ctx.globalAlpha = a * (0.55 + 0.45 * Math.sin(winT * 3)); R.drawText(ctx, touchMode ? 'TAP FOR TITLE' : 'ENTER  TITLE     N  NEW DESCENT', LW >> 1, Math.round(LH * 0.2) + 68, PAL.gold, 1, 'center'); }
      ctx.globalAlpha = 1;
    }
  }

  function showError(msg) {
    const el = document.getElementById('err');
    if (el) { el.style.display = 'block'; el.textContent = 'Dweller hit a snag:\n' + msg.slice(0, 600) + '\n\nTry reloading the page.'; }
  }

  /* ------------------------------------------------------------ boot */
  async function boot() {
    resize();
    canvas.tabIndex = 0; canvas.style.outline = 'none'; grabFocus();
    buildTouchUI();
    loadSave();
    const q = new URLSearchParams(location.search);
    try {
      await R.load(window.DWELLER_ASSETS);
      world = D.makeWorld(window.DWELLER_LEVEL);
      R.prepare(world);
      S = D.newState(world); snapCamera();
    } catch (e) { showError(String(e && e.stack || e)); console.error(e); return; }
    const ld = document.getElementById('loading'); if (ld) ld.remove();
    mode = 'title'; titleT = 0;
    if (q.get('speed')) speedMul = Math.max(1, Math.min(32, parseFloat(q.get('speed')) || 1));
    lastT = performance.now();
    requestAnimationFrame(frame);
    // debug / test hooks
    window.__dweller = {
      get state() { return S; }, get world() { return world; }, get mode() { return mode; },
      start(fresh) { startGame(!!fresh); },
      replay(inputs, speed) { replay = inputs; replayI = 0; speedMul = speed || 1; },
      setSpeed(v) { speedMul = v; },
      teleport(x, y) { S.x = x; S.y = y; snapCamera(); },
      shot() { return canvas.toDataURL('image/png'); },
      get ticks() { return runTicks; },
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body></html>
